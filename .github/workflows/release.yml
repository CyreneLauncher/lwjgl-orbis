name: Release LWJGL for Orbis
# Builds this port with the SDKs and dependencies pinned in dependencies.lock.json and, when
# publish is checked, publishes the result as the release <tag_prefix>-<commit> named in
# release.json. Cyrene Launcher pins that release by SHA-256 instead of building the port.
# CYRENE_RELEASES_TOKEN must be able to read the private CyreneLauncher repositories and releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release for this commit
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      ORBIS_BUILD_ROOT: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lwjgl-orbis
          persist-credentials: false
      - name: Read pinned dependencies
        id: deps
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          for name, item in json.load(open('lwjgl-orbis/dependencies.lock.json')).items():
              for key, value in item.items():
                  print(f'{name}-{key}={value}')
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.deps.outputs['orbis-runtime-support-repository'] }}
          ref: ${{ steps.deps.outputs['orbis-runtime-support-revision'] }}
          path: orbis-runtime-support
          token: ${{ secrets.CYRENE_RELEASES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The platform PRX checks the Mesa build carries this series' WSI patch.
          repository: ${{ steps.deps.outputs['mesa-orbis-repository'] }}
          ref: ${{ steps.deps.outputs['mesa-orbis-revision'] }}
          path: mesa-orbis
          sparse-checkout: orbis-port
          token: ${{ secrets.CYRENE_RELEASES_TOKEN || github.token }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 llvm-18 cmake ninja-build pkg-config python3-pyelftools
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Read pinned host JDK 17
        id: host
        run: python3 -c "import json;print('release='+json.load(open('orbis-runtime-support/toolchain.lock.json'))['host_jdks']['17'])" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ steps.host.outputs.release }}
      - name: Provision pinned SDKs
        run: python3 orbis-runtime-support/provision_sdk.py --destination "$RUNNER_TEMP/orbis-sdk"
      - name: Install the pinned Mesa release
        env:
          GH_TOKEN: ${{ secrets.CYRENE_RELEASES_TOKEN || github.token }}
          MESA_REPOSITORY: ${{ steps.deps.outputs['mesa-orbis-repository'] }}
          MESA_REVISION: ${{ steps.deps.outputs['mesa-orbis-revision'] }}
          MESA_SHA256: ${{ steps.deps.outputs['mesa-orbis-sha256'] }}
        run: |
          if [ "$MESA_SHA256" = None ]; then
            echo "dependencies.lock.json has no SHA-256 for the Mesa release; publish it and record its hash" >&2
            exit 1
          fi
          read -r prefix asset < <(python3 -c "import json;s=json.load(open('mesa-orbis/orbis-port/release.json'));print(s['tag_prefix'],s['asset'])")
          gh release download "$prefix-${MESA_REVISION::12}" --repo "$MESA_REPOSITORY" --pattern "$asset" --dir incoming
          python3 orbis-runtime-support/release_archive.py unpack --archive "incoming/$asset" \
            --root "$ORBIS_BUILD_ROOT" --sha256 "$MESA_SHA256"
      - name: Fetch official LWJGL JARs
        run: python3 lwjgl-orbis/fetch_java_artifacts.py --output "$ORBIS_BUILD_ROOT/java-jars"
      - name: Build LWJGL natives
        run: |
          for release in 3.2.2 3.3.3 3.4.1 3.4.3; do
            python3 lwjgl-orbis/build_lwjgl_natives.py --sdk "$ORBIS_SDK" --toolchain "$PS4_TOOLCHAIN" --jni-headers "$JAVA_HOME/include" --release "$release" --fetch
          done
          python3 lwjgl-orbis/build_lwjgl_optional.py --sdk "$ORBIS_SDK" --toolchain "$PS4_TOOLCHAIN" --jni-headers "$JAVA_HOME/include" --jars "$ORBIS_BUILD_ROOT/java-jars/3.2.2"
      - name: Build FreeType, SPIR-V and VMA
        run: |
          for release in 3.3.3 3.4.1 3.4.3; do
            python3 lwjgl-orbis/build_freetype.py --sdk "$ORBIS_SDK" --toolchain "$PS4_TOOLCHAIN" --release "$release" --fetch
          done
          python3 lwjgl-orbis/build_spirv.py --sdk "$ORBIS_SDK" --toolchain "$PS4_TOOLCHAIN" --release 3.4.3 --fetch
          python3 lwjgl-orbis/build_vma.py --sdk "$ORBIS_SDK" --toolchain "$PS4_TOOLCHAIN" --jni-headers "$JAVA_HOME/include" --release 3.4.3 --jars "$ORBIS_BUILD_ROOT/java-jars/3.4.3"
      - name: Link the platform PRX against the Mesa release
        run: |
          python3 lwjgl-orbis/build_platform_prx.py --sdk "$ORBIS_SDK" --toolchain "$PS4_TOOLCHAIN" --jni-headers "$JAVA_HOME/include" \
            --build "$ORBIS_BUILD_ROOT/vulkan-mesa" --output "$ORBIS_BUILD_ROOT/platform-native"
      - name: Save logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs
          path: |
            build/*/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Pack release asset
        run: |
          python3 orbis-runtime-support/release_archive.py pack --root "$ORBIS_BUILD_ROOT" \
            --spec lwjgl-orbis/release.json --dist dist
          (cd dist && sha256sum ./*.tar.xz | sed 's# \./# #' > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=$(python3 -c "import json;print(json.load(open('lwjgl-orbis/release.json'))['tag_prefix'])")
          gh release create "$prefix-${GITHUB_SHA::12}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "LWJGL for Orbis ${GITHUB_SHA::12}" \
            --notes "Built on GitHub-hosted Ubuntu from commit $GITHUB_SHA with the SDKs and dependencies pinned in dependencies.lock.json. The archive holds the build outputs listed in release.json and a SHA-256 inventory; unpack it with orbis-runtime-support's release_archive.py."
